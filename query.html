<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsureCentive - Query Management</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <script src="js/mockData.js"></script>
    <script src="js/app.js"></script>
    <script>
        App.renderLayout('query');
        App.setPageTitle('Query & Dispute Resolution');

        const queries = App.getData('ic_platform_queries');
        const schemes = App.getData('ic_platform_schemes');

        // Count disputes per scheme
        const heatmapData = {};
        schemes.forEach(s => heatmapData[s.id] = { name: s.name, count: 0 });
        queries.forEach(q => { if (heatmapData[q.scheme_tagged]) heatmapData[q.scheme_tagged].count++; });

        const openCount = queries.filter(q => q.status === 'Open').length;
        const wipCount = queries.filter(q => q.status === 'WIP').length;
        const slaBreach = queries.filter(q => q.sla_breached && q.status !== 'Closed').length;

        const pageHTML = `
      <div class="grid-cards animate-slide-in">
        <div class="metric-card">
          <div class="metric-title">Open Tickets</div>
          <div class="metric-value">${openCount}</div>
          <div class="metric-trend trend-down"><i class="fas fa-exclamation-circle"></i> Requires attention</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">WIP Tickets</div>
          <div class="metric-value">${wipCount}</div>
          <div class="metric-trend trend-info"><i class="fas fa-spinner"></i> Under investigation</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">SLA Breached</div>
          <div class="metric-value" style="color: var(--danger)">${slaBreach}</div>
          <div class="metric-trend trend-down"><i class="fas fa-fire"></i> Escalated to Zone Head</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Actions</div>
          <button class="btn btn-primary" onclick="showCreateTicket()" style="margin-top: 10px; width:100%">+ Raise Ticket</button>
        </div>
      </div>

      <div class="grid-2 animate-slide-in" style="animation-delay: 0.1s">
        <!-- Ticket Table -->
        <div class="panel">
          <div class="panel-header">
            <h3 class="panel-title">Active Queries</h3>
          </div>
          <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
            <table class="data-table">
              <thead><tr><th>Ticket ID</th><th>IC ID</th><th>Issue</th><th>Status</th><th>Timer</th><th>Explain</th></tr></thead>
              <tbody>
                ${queries.slice(0, 10).map(q => {
            let badgeData = '';
            if (q.status === 'Open') badgeData = 'class="status-badge status-danger"';
            else if (q.status === 'WIP') badgeData = 'class="status-badge status-warning"';
            else if (q.status === 'Resolved') badgeData = 'class="status-badge status-info"';
            else badgeData = 'class="status-badge status-success"';

            return `
                  <tr>
                    <td>${q.id}</td>
                    <td>${q.ic_id}</td>
                    <td>${q.issue_type}</td>
                    <td><span ${badgeData}>${q.status}</span></td>
                    <td>${q.sla_breached && q.status !== 'Closed' ? '<span style="color:var(--danger)">Breached</span>' : '48 hrs'}</td>
                    <td><button class="action-btn" onclick="showBreakdown('${q.id}')"><i class="fas fa-search-dollar"></i></button></td>
                  </tr>
                `}).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <!-- Heatmap Chart -->
        <div class="panel">
          <div class="panel-header">
            <h3 class="panel-title">Dispute Heatmap (By Scheme)</h3>
          </div>
          <div class="chart-container">
            <canvas id="disputeChart"></canvas>
          </div>
        </div>
      </div>
    `;

        App.setContent(pageHTML);

        const disputeCtx = document.getElementById('disputeChart');
        const chartLabels = Object.values(heatmapData).map(d => d.name).slice(0, 5);
        const chartData = Object.values(heatmapData).map(d => d.count).slice(0, 5);

        new Chart(disputeCtx, {
            type: 'bar',
            data: {
                labels: chartLabels,
                datasets: [{
                    label: 'Ticket Volume',
                    data: chartData,
                    backgroundColor: '#ef4444',
                    borderRadius: 4
                }]
            },
            options: { maintainAspectRatio: false }
        });

        window.showCreateTicket = function () {
            const modalBody = `
        <div class="form-group">
          <label class="form-label">Select Scheme / Contest</label>
          <select class="form-control">
            ${schemes.map(s => `<option value="${s.id}">${s.name} (${s.type})</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Issue Type</label>
          <select class="form-control">
            <option>Payout Mismatch</option>
            <option>Policy Not Reflected</option>
            <option>Clawback Dispute</option>
            <option>TDS Issue</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-control" rows="4" placeholder="Auto-tagging enabled based on scheme..."></textarea>
        </div>
      `;
            App.openModal("Create New Query", modalBody);
        };

        window.showBreakdown = function (ticketId) {
            const modalBody = `
        <div class="alert-box alert-info">
          <i class="fas fa-info-circle alert-icon"></i>
          <div><strong>Explain My Payout for ${ticketId}:</strong> The system deducted 50% NB owing to 13M persistency dropping below 75% as per Q3 Logic.</div>
        </div>
        <table class="data-table">
          <tr><th>Component</th><th>Amount</th><th>Logic Applied</th></tr>
          <tr><td>Base NB Premium</td><td>₹ 1,50,000</td><td>Standard 15% Slab</td></tr>
          <tr><td>Persistency Penalty</td><td style="color:var(--danger)">- ₹ 75,000</td><td>< 75% Gate triggered</td></tr>
          <tr><td>Net Payable</td><td>₹ 75,000</td><td>After deductions</td></tr>
        </table>
      `;
            App.openModal("Payout Breakdown Simulation", modalBody);
        }
    </script>
</body>

</html>
