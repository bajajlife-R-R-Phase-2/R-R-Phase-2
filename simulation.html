<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InsureCentive - Simulation Engine</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/mockData.js"></script>
  <script src="js/app.js"></script>
  <script>
    App.renderLayout('simulation');
    App.setPageTitle('Incentive Payout Simulation & AI Forecasting');

    const aggData = JSON.parse(localStorage.getItem('ic_platform_aggregate'));

    const pageHTML = `
      <div class="alert-box alert-info animate-slide-in">
        <i class="fas fa-robot alert-icon"></i>
        <div>
          <strong>AI-Powered Forecasting Active:</strong> This sandbox allows you to securely simulate incentive budget fluctuations based on behavioral agent shifts, gamification multipliers, and AI-identified structural leakages.
        </div>
      </div>

      <div class="grid-2 animate-slide-in" style="animation-delay: 0.1s; grid-template-columns: 1.5fr 1fr">
        <!-- Input & Controls -->
        <div>
          <!-- SCENARIO STAGE -->
          <div class="panel" style="margin-bottom: 20px;">
            <div class="panel-header" style="display:flex; justify-content:space-between">
              <h3 class="panel-title"><i class="fas fa-sliders-h"></i> 1. Multi-Scenario Modeling</h3>
              <div style="display:flex; gap: 5px;">
                <button class="btn btn-outline btn-sm" onclick="applyPreset('worst')">Worst Case</button>
                <button class="btn btn-outline btn-sm" onclick="applyPreset('realistic')">Realistic</button>
                <button class="btn btn-primary btn-sm" onclick="applyPreset('best')">Best Case</button>
              </div>
            </div>
            
            <div class="grid-2">
              <div class="form-group">
                <label class="form-label">Base NB Commission Rate (%)</label>
                <input type="range" class="form-control" min="5" max="30" value="15" id="sim-nb" oninput="updateSimLabel('nb', this.value); runSimulation()">
                <div style="text-align: right; font-size: 0.8rem; font-weight: bold; margin-top: 4px;" id="val-nb">15%</div>
              </div>
              <div class="form-group">
                <label class="form-label">Persistency Qualifier Threshold (%)</label>
                <input type="range" class="form-control" min="60" max="95" value="75" id="sim-pers" oninput="updateSimLabel('pers', this.value); runSimulation()">
                <div style="text-align: right; font-size: 0.8rem; font-weight: bold; margin-top: 4px;" id="val-pers">75%</div>
              </div>
            </div>
            <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
              <input type="checkbox" id="sim-catchup" checked style="width: 18px; height: 18px; cursor: pointer;" onchange="runSimulation()">
              <label class="form-label" style="margin: 0; cursor: pointer" for="sim-catchup">Enable 'Q4 Catch-up' Benefit (+2% NB boost if YTD > 100%)</label>
            </div>
          </div>

          <!-- BEHAVIORAL IMPACT -->
          <div class="panel">
            <div class="panel-header">
              <h3 class="panel-title"><i class="fas fa-brain"></i> 2. Behavioral Impact Simulator</h3>
            </div>
            <div class="grid-2">
               <div class="form-group">
                  <label class="form-label">Target Increase Constraint (%)</label>
                  <input type="range" class="form-control" min="0" max="50" value="10" id="sim-tgt" oninput="updateSimLabel('tgt', this.value); runSimulation()">
                  <div style="text-align: right; font-size: 0.8rem; font-weight: bold; margin-top: 4px; color: var(--danger)" id="val-tgt">10%</div>
               </div>
               <div class="form-group">
                  <label class="form-label">Gamification Engagement Multiplier (x)</label>
                  <input type="range" class="form-control" min="1.0" max="2.0" step="0.1" value="1.2" id="sim-gm" oninput="updateSimLabel('gm', this.value); runSimulation()">
                  <div style="text-align: right; font-size: 0.8rem; font-weight: bold; margin-top: 4px; color: var(--success)" id="val-gm">1.2x</div>
               </div>
            </div>
            <div style="background: var(--bg-app); border-left:4px solid var(--info); padding: 12px; font-size: 0.85rem;">
               <strong>Behavioral Output:</strong> At a <span id="out-tgt">10%</span> target stretch coupled with a <span id="out-gm">1.2x</span> gamification boost, the AI predicts a net <strong><span id="out-nb-impact" style="color:var(--success)">+4.5%</span></strong> aggregate shift in NB generation.
            </div>
          </div>
        </div>

        <!-- Output & Analytics -->
        <div>
          <!-- ROI CALCULATOR -->
          <div class="panel" style="margin-bottom: 20px;">
            <div class="panel-header" style="margin-bottom: 10px;">
              <h3 class="panel-title"><i class="fas fa-calculator"></i> ROI Calculator</h3>
            </div>
            <table class="data-table" style="font-size: 0.9rem">
              <tbody>
                <tr><th>Projected NB Revenue</th><td id="calc-rev" style="text-align:right">Loading...</td></tr>
                <tr><th>Calculated Incentive Cost</th><td id="calc-cost" style="text-align:right">Loading...</td></tr>
                <tr><th>Net Liability Variance</th><td id="calc-var" style="text-align:right">--</td></tr>
                <tr style="background: var(--bg-app); font-size: 1.1rem">
                  <th style="padding: 15px">Incentive-to-Revenue Ratio</th>
                  <td id="calc-ratio" style="text-align:right; font-weight:bold; color:var(--primary); padding: 15px">--</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- AI OPTIMIZATION -->
          <div class="panel">
            <div class="panel-header" style="margin-bottom: 15px;">
              <h3 class="panel-title" style="color:var(--primary)"><i class="fas fa-magic"></i> AI-Powered Optimization</h3>
            </div>
            <div style="font-size: 0.85rem; line-height: 1.6;">
               <div style="border-bottom: 1px solid var(--border); padding-bottom:10px; margin-bottom:10px">
                  <span style="color: var(--danger); font-weight:bold"><i class="fas fa-search-dollar"></i> Leakage Identified:</span> High density of agents in Slab 2 generating exactly 101% of target. Potential capping behavior.
               </div>
               <div style="margin-bottom:15px">
                  <span style="color: var(--success); font-weight:bold"><i class="fas fa-lightbulb"></i> AI Suggestion:</span> Smooth the cliff between Slab 1 (10%) and Slab 2 (15%) by introducing a micro-slab (12%) at 95% achievement to promote continuous pipeline building.
               </div>
               <button class="btn btn-outline" style="width:100%" onclick="applyAIOptimization()"><i class="fas fa-wrench"></i> Apply Optimal Slab Curve</button>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Sensitivity Chart -->
      <div class="panel animate-slide-in" style="animation-delay: 0.2s; margin-top:20px;">
         <div class="panel-header">
            <h3 class="panel-title">Budget Sensitivity Analysis (Payout vs Revenue Projection)</h3>
         </div>
         <div class="chart-container" style="height: 350px;">
            <canvas id="sensitivityChart"></canvas>
         </div>
      </div>
    `;

    App.setContent(pageHTML);

    window.updateSimLabel = (id, val) => {
      document.getElementById(`val-${id}`).innerText = (id === 'gm' ? val + 'x' : val + '%');
    };

    let chartInstance = null;

    window.applyPreset = (type) => {
      if (type === 'best') {
        document.getElementById('sim-nb').value = 12;
        document.getElementById('sim-pers').value = 80;
        document.getElementById('sim-tgt').value = 25;
        document.getElementById('sim-gm').value = 1.5;
      } else if (type === 'realistic') {
        document.getElementById('sim-nb').value = 15;
        document.getElementById('sim-pers').value = 75;
        document.getElementById('sim-tgt').value = 10;
        document.getElementById('sim-gm').value = 1.2;
      } else if (type === 'worst') {
        document.getElementById('sim-nb').value = 22;
        document.getElementById('sim-pers').value = 65;
        document.getElementById('sim-tgt').value = 5;
        document.getElementById('sim-gm').value = 1.0;
      }

      ['nb', 'pers', 'tgt', 'gm'].forEach(id => {
        const val = document.getElementById(`sim-${id}`).value;
        updateSimLabel(id, val);
      });

      runSimulation();
    };

    window.applyAIOptimization = () => {
      document.getElementById('sim-nb').value = 13; // Slight reduction in base
      document.getElementById('sim-pers').value = 75; // Keep persistency hold
      ['nb', 'pers'].forEach(id => {
        const val = document.getElementById(`sim-${id}`).value;
        updateSimLabel(id, val);
      });
      runSimulation();
      alert('AI Optimized Grid Applied. Micro-slabs enabled in the rules engine. Incentive Cost significantly optimized against Revenue.');
    };

    window.runSimulation = () => {
      const nbRate = parseInt(document.getElementById('sim-nb').value) / 100; // actual pct
      const persBrake = parseInt(document.getElementById('sim-pers').value);
      const isCatchup = document.getElementById('sim-catchup').checked;

      const tgtStretch = parseInt(document.getElementById('sim-tgt').value);
      const gmMult = parseFloat(document.getElementById('sim-gm').value);

      document.getElementById('out-tgt').innerText = tgtStretch + '%';
      document.getElementById('out-gm').innerText = gmMult + 'x';

      // 1. Behavioral Model Prediction
      // Formula: (Gamification boost) - (Target stretch friction)
      const engagementBoost = (gmMult - 1.0) * 15; // e.g. 1.2x = +3.0%
      const friction = tgtStretch * 0.15; // e.g. 10% stretch = -1.5%
      const netBehavShift = engagementBoost - friction;

      const elShift = document.getElementById('out-nb-impact');
      elShift.innerText = (netBehavShift > 0 ? '+' : '') + netBehavShift.toFixed(1) + '%';
      elShift.style.color = netBehavShift >= 0 ? 'var(--success)' : 'var(--danger)';

      // 2. Financial Simulation
      // Base System Total NB is roughly totalNBComms / 0.15 in mock data
      const baseTotalNBRev = aggData.nbComponent / 0.15;
      const projNBRev = baseTotalNBRev * (1 + (netBehavShift / 100)); // Revenue shifted by behavior

      // Calculate isolated Costs
      let simNBCost = projNBRev * nbRate;
      let simRenCost = aggData.renewalComponent; // Fixed for now

      // Catchup factor
      if (isCatchup) simNBCost *= 1.02;

      // Persistency brake factor logic (mock)
      // If threshold is higher, we save more money (as agents fail to hit it)
      const persSavingsDrop = (persBrake - 60) * 0.005; // 0.5% savings for every % threshold increase above 60
      simNBCost *= (1 - persSavingsDrop);

      const totalSimCost = simNBCost + simRenCost;
      const varianceVal = totalSimCost - aggData.totalLiability;
      const ratio = (totalSimCost / projNBRev) * 100;

      // Update UI ROI Calc
      document.getElementById('calc-rev').innerText = App.formatCurrency(projNBRev);
      document.getElementById('calc-cost').innerText = App.formatCurrency(totalSimCost);

      const varEl = document.getElementById('calc-var');
      varEl.innerText = (varianceVal > 0 ? '+' : '') + App.formatCurrency(varianceVal);
      varEl.style.color = varianceVal > 0 ? 'var(--danger)' : 'var(--success)';

      const rColor = ratio > 15 ? 'var(--danger)' : (ratio > 12 ? 'var(--warning)' : 'var(--success)');
      document.getElementById('calc-ratio').innerHTML = `<span style="color:${rColor}">${ratio.toFixed(2)}%</span>`;

      // Update Sensitivity Chart
      // Map Payout vs Revenue Projection across various achievement levels
      const xLabels = [];
      const revenueData = [];
      const costData = [];

      for (let ach = 80; ach <= 130; ach += 10) {
        xLabels.push(ach + '% Target Ach.');

        let simRev = projNBRev * (ach / 100);
        revenueData.push(simRev);

        let stepNBCost = simRev * nbRate;
        if (isCatchup && ach > 100) {
          stepNBCost *= 1.02; // Kink in the curve
        }
        stepNBCost *= (1 - persSavingsDrop);

        let stepTotalCost = stepNBCost + simRenCost;
        costData.push(stepTotalCost);
      }

      renderChart(xLabels, revenueData, costData);
    };

    const renderChart = (xLabels, revenueData, costData) => {
      // Safely destroy existing chart
      let existingChart = Chart.getChart("sensitivityChart");
      if (existingChart) { existingChart.destroy(); }

      App.renderChart('sensitivityChart', 'bar', {
        labels: xLabels,
        datasets: [
          {
            type: 'line',
            label: 'Projected Revenue',
            data: revenueData,
            borderColor: '#0ea5e9',
            backgroundColor: '#0ea5e9',
            borderWidth: 2,
            tension: 0.4,
            yAxisID: 'y'
          },
          {
            type: 'bar',
            label: 'Total Incentive Cost',
            data: costData,
            backgroundColor: 'rgba(15, 63, 140, 0.7)',
            borderRadius: 4,
            yAxisID: 'y'
          }
        ]
      }, {
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              callback: function (value) {
                return '₹' + (value / 10000000).toFixed(2) + 'Cr';
              }
            }
          }
        }
      });
    };

    // Boot
    runSimulation();

  </script>
</body>

</html>
