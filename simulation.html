<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsureCentive - Payout Simulation</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <script src="js/mockData.js"></script>
    <script src="js/app.js"></script>
    <script>
        App.renderLayout('simulation');
        App.setPageTitle('Incentive Scheme Simulator');

        const agg = App.getData('ic_platform_aggregate');
        const basePayout = agg.totalLiability;

        const pageHTML = `
      <div class="grid-2 animate-slide-in">
        <!-- Configuration Panel -->
        <div class="panel">
          <div class="panel-header">
            <h3 class="panel-title"><i class="fas fa-sliders-h"></i> Simulation Parameters</h3>
          </div>
          <div class="form-group">
            <label class="form-label">Base NB Slab % Adjustment (Current: 15%)</label>
            <input type="range" id="sim-nb" class="form-control" min="5" max="25" value="15" oninput="document.getElementById('nb-val').innerText=this.value+'%'">
            <div style="text-align: right; font-size: 0.8rem; font-weight: bold; margin-top: 4px;" id="nb-val">15%</div>
          </div>
          <div class="form-group">
            <label class="form-label">Persistency Threshold (Current: 75%)</label>
            <input type="range" id="sim-pers" class="form-control" min="50" max="95" value="75" oninput="document.getElementById('pers-val').innerText=this.value+'%'">
            <div style="text-align: right; font-size: 0.8rem; font-weight: bold; margin-top: 4px;" id="pers-val">75%</div>
          </div>
          <div class="form-group">
            <label class="form-label">Renewal Multiplier</label>
            <select id="sim-ren" class="form-control">
              <option value="1">1.0x (Standard)</option>
              <option value="1.5">1.5x (Aggressive)</option>
              <option value="2">2.0x (Strategic Push)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Catch-up Benefit Toggle</label>
            <label style="display:flex; align-items:center; gap:8px;">
              <input type="checkbox" id="sim-catchup"> Enable 2% Extra for Q4
            </label>
          </div>
          
          <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="runSimulation()">Run Simulation <i class="fas fa-play"></i></button>
          <button class="btn btn-outline" style="width: 100%; margin-top: 10px;">Save Scenario</button>
        </div>

        <!-- Impact Results Panel -->
        <div class="panel">
          <div class="panel-header">
            <h3 class="panel-title"><i class="fas fa-chart-pie"></i> Financial Impact (vs Actuals)</h3>
          </div>
          
          <div id="sim-results" style="opacity: 0.5; pointer-events: none; transition: var(--transition)">
            <div class="grid-2">
              <div class="metric-card" style="box-shadow: none; border: 1px solid var(--border)">
                <div class="metric-title">Current Liability</div>
                <div class="metric-value" style="font-size: 1.2rem">${App.formatCurrency(basePayout)}</div>
              </div>
              <div class="metric-card" style="box-shadow: none; border: 1px solid var(--border)">
                <div class="metric-title">Simulated Liability</div>
                <div class="metric-value" style="font-size: 1.2rem; color: var(--primary)" id="res-val">--</div>
              </div>
            </div>

            <div class="alert-box alert-warning" style="margin-top: 20px;" id="res-alert">
              <i class="fas fa-info-circle alert-icon"></i>
              <div>Run simulation to view Variance % and ROI impact on club qualifications.</div>
            </div>

            <table class="data-table" style="margin-top: 20px;">
              <tbody>
                <tr>
                  <th>Budget Impact Variance</th>
                  <td id="res-var" style="font-weight: bold">--</td>
                </tr>
                <tr>
                  <th>Eligible Payee Count</th>
                  <td id="res-payee">--</td>
                </tr>
                <tr>
                  <th>MDRT Qualification Projection</th>
                  <td id="res-mdrt">--</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    `;

        App.setContent(pageHTML);

        window.runSimulation = function () {
            const nbChange = (parseInt(document.getElementById('sim-nb').value) - 15) / 100; // variance from 15%
            const renMult = parseFloat(document.getElementById('sim-ren').value);
            const persChange = parseInt(document.getElementById('sim-pers').value);
            const catchup = document.getElementById('sim-catchup').checked ? 0.02 : 0;

            // Mock calculation logic
            let simNB = agg.nbComponent * (1 + nbChange + catchup);
            let simRen = agg.renewalComponent * renMult;

            // Affect payee count by persistency gate
            let payeeMultiplier = 1;
            if (persChange > 75) payeeMultiplier = 0.8; // harder, less payees
            if (persChange < 75) payeeMultiplier = 1.15; // easier, more payees

            let finalPayout = (simNB + simRen) * payeeMultiplier;
            let variance = ((finalPayout - basePayout) / basePayout) * 100;

            const resultsDiv = document.getElementById('sim-results');
            resultsDiv.style.opacity = '1';

            document.getElementById('res-val').innerText = App.formatCurrency(finalPayout);
            document.getElementById('res-var').innerHTML = variance > 0
                ? `<span style="color:var(--danger)">+${variance.toFixed(2)}% Over Budget</span>`
                : `<span style="color:var(--success)">${variance.toFixed(2)}% Savings</span>`;

            document.getElementById('res-payee').innerText = Math.floor(100 * payeeMultiplier) + ' ICs';
            document.getElementById('res-mdrt').innerText = Math.floor(12 * (1 + nbChange) * payeeMultiplier) + ' Expected';

            const alertDiv = document.getElementById('res-alert');
            alertDiv.className = variance > 10 ? 'alert-box alert-warning' : 'alert-box alert-info';
            alertDiv.innerHTML = `<i class="fas fa-chart-line alert-icon"></i><div><strong>ROI Estimate:</strong> Incremental payout is projected to drive ${App.formatCurrency(Math.abs(finalPayout - basePayout) * 5)} in new premium growth.</div>`;
        };

    </script>
</body>

</html>
