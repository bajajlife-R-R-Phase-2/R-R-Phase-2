<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsureCentive - Agency Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <script src="js/mockData.js"></script>
    <script src="js/app.js"></script>
    <script>
        App.renderLayout('agency');
        App.setPageTitle('Agency Channel Performance');

        // Filter Agency Data
        const ics = App.getData('ic_platform_ics').filter(ic => ic.channel === 'Agency');

        let totalTarget = 0, totalNB = 0, totalRen = 0;
        let mdrtCount = 0, goldCount = 0, silverCount = 0;

        ics.forEach(ic => {
            totalTarget += ic.goalsheet_target;
            totalNB += ic.nb_premium;
            totalRen += ic.renewal_premium;
            if (ic.club_status === 'MDRT') mdrtCount++;
            if (ic.club_status === 'Gold') goldCount++;
            if (ic.club_status === 'Silver') silverCount++;
        });

        const rnb = totalNB + (totalRen * 0.2); // RNB logic (mock 20% weightage on renewal)
        const achievement = (totalNB / totalTarget) * 100;

        const pageHTML = `
      <div class="grid-cards animate-slide-in">
        <div class="metric-card">
          <div class="metric-title">Agency Goalsheet vs NB</div>
          <div class="metric-value">${achievement.toFixed(1)}%</div>
          <div class="metric-trend trend-up">
            <div class="progress-bar-container">
              <div class="progress-bar" style="width: ${achievement}%; background-color: var(--primary)"></div>
            </div>
            <span style="margin-top: 8px; font-size: 0.75rem;">${App.formatCurrency(totalNB)} / ${App.formatCurrency(totalTarget)}</span>
          </div>
        </div>
        <div class="metric-card">
          <div class="metric-title">RNB Performance (Weighted)</div>
          <div class="metric-value">${App.formatCurrency(rnb)}</div>
          <div class="metric-trend trend-up"><i class="fas fa-check-circle"></i> NB + 20% Renewal Weight</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Club Qualifiers (MDRT/Gold)</div>
          <div class="metric-value">${mdrtCount + goldCount} <span style="font-size: 1rem; color: var(--text-muted)">ICs</span></div>
          <div class="metric-trend trend-up"><i class="fas fa-trophy"></i> Elite performers tracking high</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">SM Override (L1/L2 View)</div>
          <div class="metric-value">${App.formatCurrency(totalNB * 0.03)}</div>
          <div class="metric-trend trend-up"><i class="fas fa-money-bill-wave"></i> Projected SM Comm at 3%</div>
        </div>
      </div>

      <div class="grid-2 animate-slide-in" style="animation-delay: 0.1s">
        <div class="panel">
          <div class="panel-header">
            <h3 class="panel-title">QSB & Power Reward Tracker</h3>
          </div>
          <table class="data-table">
            <thead><tr><th>IC Name</th><th>Branch</th><th>Power Reward Status</th><th>QSB Payout</th></tr></thead>
            <tbody>
              ${ics.slice(0, 5).map(ic => `
                <tr>
                  <td>${ic.name}</td>
                  <td>${ic.branch_id}</td>
                  <td>${Math.random() > 0.5 ? '<span class="status-badge status-success">Qualified</span>' : '<span class="status-badge status-warning">In Progress</span>'}</td>
                  <td>${App.formatCurrency(ic.QSB_achieved ? 50000 : 0)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          <button class="btn btn-outline" style="margin-top: 16px; width: 100%">View All Agency ICs</button>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h3 class="panel-title">Club Membership Distribution</h3>
          </div>
          <div class="chart-container">
            <canvas id="clubChart"></canvas>
          </div>
        </div>
      </div>
    `;

        App.setContent(pageHTML);

        const clubCtx = document.getElementById('clubChart');
        new Chart(clubCtx, {
            type: 'bar',
            data: {
                labels: ['MDRT', 'Gold', 'Silver', 'Bronze', 'None'],
                datasets: [{
                    label: 'Number of ICs',
                    data: [mdrtCount, goldCount, silverCount, ics.length - (mdrtCount + goldCount + silverCount) - 10, 10],
                    backgroundColor: ['#10b981', '#f59e0b', '#94a3b8', '#d97706', '#ef4444'],
                    borderRadius: 4
                }]
            },
            options: { maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });

    </script>
</body>

</html>
