<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InsureCentive - Gamification</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <script src="js/mockData.js"></script>
  <script src="js/app.js"></script>
  <script>
    App.renderLayout('gamification');
    App.setPageTitle('Convention & Leaderboards');

    const ics = JSON.parse(localStorage.getItem('ic_platform_ics'));
    const sorted = [...ics].sort((a, b) => b.nb_premium - a.nb_premium);

    // Badge data
    const badges = [
      { icon: 'fa-fire', name: 'First Flame', desc: 'Close 1st policy in a new quarter', unlocked: true, color: '#ef4444' },
      { icon: 'fa-gem', name: 'Diamond Closer', desc: 'Achieve 150% of monthly target', unlocked: true, color: '#8b5cf6' },
      { icon: 'fa-users', name: 'Team Builder', desc: 'Recruit 3 new agents', unlocked: true, color: '#3b82f6' },
      { icon: 'fa-rocket', name: 'Rocket Launch', desc: 'Hit ₹10L NB in single week', unlocked: false, color: '#f59e0b' },
      { icon: 'fa-trophy', name: 'Convention Elite', desc: 'Qualify for Paris 2026', unlocked: false, color: '#10b981' }
    ];

    // Reward catalog
    const rewards = [
      { name: 'Amazon Gift Card ₹500', pts: 1000, icon: 'fa-gift', color: '#f59e0b', stock: 'In Stock' },
      { name: 'Spa & Wellness Voucher', pts: 2500, icon: 'fa-spa', color: '#ec4899', stock: 'In Stock' },
      { name: 'Weekend Getaway (Lonavala)', pts: 5000, icon: 'fa-umbrella-beach', color: '#06b6d4', stock: '3 Left' },
      { name: 'Apple AirPods Pro', pts: 8000, icon: 'fa-headphones', color: '#6366f1', stock: 'In Stock' },
      { name: 'Gold Coin (2g, 24K)', pts: 10000, icon: 'fa-coins', color: '#f59e0b', stock: '5 Left' },
      { name: 'Smartwatch (Noise/boAt)', pts: 6000, icon: 'fa-clock', color: '#10b981', stock: 'In Stock' },
      { name: 'Family Dinner Voucher (Taj)', pts: 3500, icon: 'fa-utensils', color: '#ef4444', stock: 'In Stock' }
    ];

    const userPoints = 12450;

    // Weekly streak data
    const weeks = ['W1', 'W2', 'W3', 'W4', 'W5', 'W6', 'W7', 'W8', 'W9', 'W10', 'W11', 'W12'];

    // Social feed
    const feed = [
      { from: 'System', avatar: '🏆', msg: '<strong>' + (sorted[0]?.name || 'Amit') + '</strong> just hit <strong>₹25L NB</strong> this quarter! Convention-qualifying pace! 🎯', time: '2 hrs ago', type: 'achievement' },
      { from: sorted[2]?.name || 'Riya', avatar: '👏', msg: 'Huge shoutout to <strong>' + (sorted[1]?.name || 'Priya') + '</strong> for mentoring new joiners. True team player! 💪', time: '5 hrs ago', type: 'peer' },
      { from: 'System', avatar: '🔥', msg: '<strong>' + (sorted[3]?.name || 'Vikram') + '</strong> unlocked <strong>Diamond Closer</strong> badge — 150% target! 💎', time: '1 day ago', type: 'achievement' },
      { from: sorted[4]?.name || 'Sneha', avatar: '🌟', msg: 'Congratulations <strong>' + (sorted[0]?.name || 'Amit') + '</strong> on your 10-week streak! Inspiring! 🚀', time: '1 day ago', type: 'peer' },
      { from: 'System', avatar: '🎖️', msg: '<strong>Mumbai West Branch</strong> crossed ₹1Cr collective FYP — fastest this FY!', time: '2 days ago', type: 'achievement' },
      { from: sorted[1]?.name || 'Priya', avatar: '❤️', msg: 'Thank you <strong>' + (sorted[5]?.name || 'Arjun') + '</strong> for covering my meetings last week. Rockstar! 🙌', time: '3 days ago', type: 'peer' }
    ];

    // Build page
    let pageHTML = '';

    // Convention Tracker
    pageHTML += `
        <div class="panel animate-slide-in" style="background: linear-gradient(135deg, #1e3a8a, #0f172a); color: white; border: none;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <h2 style="margin:0 0 10px; font-size: 1.5rem"><i class="fas fa-plane-departure" style="color:#fbbf24"></i> "Target Paris 2026" Convention</h2>
              <p style="margin:0; opacity:0.8; font-size: 0.9rem">Top 50 ICs nationally secure an all-expenses paid trip!</p>
            </div>
            <div style="text-align:right">
              <div style="font-size: 2rem; font-weight:800; font-family:monospace" id="countdown">--</div>
              <div style="font-size: 0.75rem; text-transform:uppercase; opacity:0.8">Time Remaining</div>
            </div>
          </div>
          <div style="margin-top: 30px;">
            <div style="display:flex; justify-content:space-between; margin-bottom: 5px; font-size: 0.8rem">
              <span>YTD Qualifying FYP: ₹ 1.25 Cr</span><span>Target: ₹ 1.50 Cr</span>
            </div>
            <div class="progress-bar-container" style="background: rgba(255,255,255,0.2);">
              <div class="progress-bar" style="width: 83%; background: #fbbf24;"></div>
            </div>
          </div>
        </div>`;

    // ROW 1: Achievement Badges + Streak Tracking
    pageHTML += `<div class="grid-2 animate-slide-in" style="animation-delay: 0.1s">`;

    // 1. Achievement Badges & Tiers
    let badgesHTML = badges.map(b => `
          <div style="display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:8px; border:1px solid ${b.unlocked ? b.color : 'var(--border)'}; background:${b.unlocked ? b.color + '10' : 'var(--bg-app)'}; ${!b.unlocked ? 'opacity:0.5;' : ''}">
            <div style="width:36px; height:36px; border-radius:50%; background:${b.unlocked ? b.color : '#94a3b8'}; color:white; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
              <i class="fas ${b.icon}"></i>
            </div>
            <div style="flex:1;">
              <strong style="font-size:0.85rem;">${b.name}</strong>
              <div style="font-size:0.75rem; color:var(--text-muted);">${b.desc}</div>
            </div>
            <div>
              ${b.unlocked ? '<span class="status-badge status-success" style="font-size:0.7rem"><i class="fas fa-check"></i> Unlocked</span>' : '<span class="status-badge" style="background:#e2e8f0; font-size:0.7rem"><i class="fas fa-lock"></i> Locked</span>'}
            </div>
          </div>`).join('');

    const mdrtCount = ics.filter(i => i.club_status === 'MDRT').length;
    const silverCount = ics.filter(i => i.club_status === 'Silver').length;
    const goldCount = ics.filter(i => i.club_status === 'Gold').length;

    pageHTML += `
        <div class="panel">
          <div class="panel-header"><h3 class="panel-title"><i class="fas fa-award" style="color:#fbbf24"></i> Achievement Badges & Tiers</h3></div>
          <div style="display: flex; gap: 12px; margin-bottom: 20px;">
            <div style="flex:1; text-align:center; padding:15px; border-radius:10px; background: linear-gradient(135deg, #fef3c7, #fde68a); border: 2px solid #f59e0b;">
              <i class="fas fa-crown" style="font-size: 1.8rem; color: #f59e0b; margin-bottom: 8px; display:block;"></i>
              <div style="font-size:1.3rem; font-weight:bold; color:#92400e;">${mdrtCount}</div>
              <div style="font-size:0.75rem; color:#92400e; font-weight:600;">GOLD / MDRT</div>
            </div>
            <div style="flex:1; text-align:center; padding:15px; border-radius:10px; background: linear-gradient(135deg, #e5e7eb, #d1d5db); border: 2px solid #9ca3af;">
              <i class="fas fa-medal" style="font-size: 1.8rem; color: #6b7280; margin-bottom: 8px; display:block;"></i>
              <div style="font-size:1.3rem; font-weight:bold; color:#374151;">${silverCount}</div>
              <div style="font-size:0.75rem; color:#374151; font-weight:600;">SILVER</div>
            </div>
            <div style="flex:1; text-align:center; padding:15px; border-radius:10px; background: linear-gradient(135deg, #fed7aa, #fdba74); border: 2px solid #ea580c;">
              <i class="fas fa-shield-alt" style="font-size: 1.8rem; color: #c2410c; margin-bottom: 8px; display:block;"></i>
              <div style="font-size:1.3rem; font-weight:bold; color:#7c2d12;">${goldCount}</div>
              <div style="font-size:0.75rem; color:#7c2d12; font-weight:600;">BRONZE</div>
            </div>
          </div>
          <h4 style="font-size:0.9rem; margin-bottom:10px;"><i class="fas fa-lock-open" style="color:var(--primary)"></i> Dynamic Badge Unlocks</h4>
          <div style="display:flex; flex-direction:column; gap:8px;">${badgesHTML}</div>
        </div>`;

    // 2. Streak Tracking
    let weeksHTML = weeks.map((w, i) => {
      const hit = i < 9;
      const current = i === 9;
      return `<div style="flex:1; min-width:45px; text-align:center; padding:8px 4px; border-radius:8px; background:${current ? 'var(--primary)' : hit ? 'var(--success)' : 'var(--bg-app)'}; color:${hit || current ? 'white' : 'var(--text-muted)'}; border:1px solid ${current ? 'var(--primary)' : hit ? 'var(--success)' : 'var(--border)'}; font-size:0.7rem;">
            <i class="fas ${current ? 'fa-spinner fa-spin' : hit ? 'fa-check' : 'fa-minus'}" style="display:block; margin-bottom:2px;"></i>${w}</div>`;
    }).join('');

    let momentumHTML = sorted.slice(0, 5).map((ic, idx) => {
      const m = Math.min(100, Math.round(50 + (ic.nb_premium / 300000) + Math.random() * 20));
      const mColor = m > 85 ? 'var(--success)' : m > 70 ? 'var(--warning)' : 'var(--danger)';
      return `<div style="display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:0.85rem;">
            <span style="width:20px; font-weight:bold; color:var(--text-muted);">#${idx + 1}</span>
            <span style="flex:1; font-weight:500;">${ic.name}</span>
            <div class="progress-bar-container" style="width:80px; margin:0; height:6px;"><div class="progress-bar" style="width:${m}%; background:${mColor};"></div></div>
            <span style="font-weight:bold; font-size:0.8rem; color:${mColor};">${m}</span>
          </div>`;
    }).join('');

    pageHTML += `
        <div class="panel">
          <div class="panel-header"><h3 class="panel-title"><i class="fas fa-bolt" style="color:#f59e0b"></i> Streak Tracking</h3></div>
          <h4 style="font-size:0.9rem; margin-bottom:10px;"><i class="fas fa-calendar-check" style="color:var(--success)"></i> Weekly Consistency Rewards</h4>
          <div style="display:flex; gap:6px; margin-bottom:15px; flex-wrap:wrap;">${weeksHTML}</div>
          <div class="alert-box alert-success" style="margin-bottom:20px;">
            <i class="fas fa-fire-alt alert-icon"></i>
            <div style="font-size:0.85rem;"><strong>🔥 9-Week Streak!</strong> Complete Week 10 to unlock the <strong>Quarterly 5% Kicker</strong> bonus!</div>
          </div>
          <h4 style="font-size:0.9rem; margin-bottom:10px;"><i class="fas fa-tachometer-alt" style="color:var(--primary)"></i> Momentum Score</h4>
          <div style="display:flex; flex-direction:column; gap:8px;">${momentumHTML}</div>
        </div>`;

    pageHTML += `</div>`; // close grid-2

    // ROW 2: Social Recognition + Reward Marketplace
    pageHTML += `<div class="grid-2 animate-slide-in" style="animation-delay: 0.2s; margin-top:20px;">`;

    // 3. Social Recognition Feed
    let feedHTML = feed.map(post => `
          <div style="display:flex; gap:12px; padding:12px; border-radius:8px; border:1px solid var(--border); background:${post.type === 'achievement' ? '#fefce8' : 'var(--bg-app)'};">
            <div style="width:36px; height:36px; border-radius:50%; background:${post.type === 'achievement' ? '#fef3c7' : '#e0e7ff'}; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:1.2rem;">${post.avatar}</div>
            <div style="flex:1;">
              <div style="font-size:0.85rem; line-height:1.4;">${post.msg}</div>
              <div style="font-size:0.7rem; color:var(--text-muted); margin-top:4px;">${post.type === 'peer' ? '<i class="fas fa-user"></i> ' + post.from : '<i class="fas fa-robot"></i> Auto-generated'} · ${post.time}</div>
            </div>
          </div>`).join('');

    let peerOptions = ics.slice(0, 10).map(ic => `<option>${ic.name} (${ic.id})</option>`).join('');

    pageHTML += `
        <div class="panel">
          <div class="panel-header"><h3 class="panel-title"><i class="fas fa-comments" style="color:var(--primary)"></i> Social Recognition Feed</h3></div>
          <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:20px; max-height:340px; overflow-y:auto;">${feedHTML}</div>
          <h4 style="font-size:0.9rem; margin-bottom:10px;"><i class="fas fa-hand-holding-heart" style="color:var(--accent)"></i> Send Peer Recognition</h4>
          <div style="display:flex; gap:8px;">
            <select class="form-control" style="flex:1; font-size:0.85rem;">
              <option>Select a colleague...</option>
              ${peerOptions}
            </select>
            <button class="btn btn-primary btn-sm" onclick="alert('Recognition sent! 🎉 Your shoutout will appear on the board.')"><i class="fas fa-paper-plane"></i></button>
          </div>
        </div>`;

    // 4. Dynamic Reward Marketplace
    let rewardsHTML = rewards.map(item => {
      const canAfford = userPoints >= item.pts;
      return `
          <div style="display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--border); border-radius:8px; ${!canAfford ? 'opacity:0.5;' : ''}">
            <div style="width:36px; height:36px; border-radius:8px; background:${item.color}15; color:${item.color}; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
              <i class="fas ${item.icon}"></i>
            </div>
            <div style="flex:1;">
              <strong style="font-size:0.85rem;">${item.name}</strong>
              <div style="font-size:0.75rem; color:var(--text-muted);"><i class="fas fa-coins" style="color:#f59e0b"></i> ${item.pts.toLocaleString()} pts · ${item.stock}</div>
            </div>
            <button class="btn btn-sm ${canAfford ? 'btn-primary' : 'btn-outline'}" ${!canAfford ? 'disabled' : ''} onclick="alert('Redeeming ${item.name}... Points will be deducted!')" style="font-size:0.75rem; padding:4px 10px;">
              ${canAfford ? 'Redeem' : 'Need More'}
            </button>
          </div>`;
    }).join('');

    pageHTML += `
        <div class="panel">
          <div class="panel-header" style="flex-direction:column; align-items:flex-start; gap:8px;">
            <h3 class="panel-title"><i class="fas fa-store" style="color:var(--accent)"></i> Dynamic Reward Marketplace</h3>
          </div>
          <div style="background: linear-gradient(135deg, #4f46e5, #7c3aed); color:white; border-radius:10px; padding:20px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div style="font-size:0.8rem; opacity:0.8; text-transform:uppercase;">Your Redeemable Points</div>
              <div style="font-size:2rem; font-weight:800; font-family:monospace;">${userPoints.toLocaleString()}</div>
              <div style="font-size:0.75rem; opacity:0.7;">Earned from badges, streaks & performance</div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:0.75rem; opacity:0.8;">Points Expiry</div>
              <div style="font-size:0.9rem; font-weight:600;">31 Mar 2026</div>
            </div>
          </div>
          <h4 style="font-size:0.9rem; margin-bottom:10px;"><i class="fas fa-gift" style="color:var(--danger)"></i> Non-Cash Incentive Catalog</h4>
          <div style="display:flex; flex-direction:column; gap:8px; max-height:260px; overflow-y:auto;">${rewardsHTML}</div>
        </div>`;

    pageHTML += `</div>`; // close grid-2

    // Leaderboard at bottom
    let leaderHTML = sorted.slice(0, 10).map((ic, idx) => {
      const m = Math.min(100, Math.round(50 + (ic.nb_premium / 300000) + Math.random() * 20));
      return `<tr>
            <td style="font-weight:bold; font-size:1.1rem; color:${idx === 0 ? '#fbbf24' : (idx === 1 ? '#9ca3af' : (idx === 2 ? '#d97706' : 'var(--text)'))}">#${idx + 1} ${idx < 3 ? '<i class="fas fa-star" style="font-size:0.8rem"></i>' : ''}</td>
            <td><strong>${ic.name}</strong></td>
            <td>${ic.zone} / ${ic.branch_id}</td>
            <td style="font-weight:bold">${App.formatCurrency(ic.nb_premium)}</td>
            <td><div style="display:flex; align-items:center; gap:6px;"><div class="progress-bar-container" style="width:60px; margin:0; height:5px;"><div class="progress-bar" style="width:${m}%; background:${m > 85 ? 'var(--success)' : 'var(--warning)'};"></div></div><span style="font-size:0.8rem;">${m}</span></div></td>
          </tr>`;
    }).join('');

    pageHTML += `
        <div class="panel animate-slide-in" style="animation-delay: 0.3s; margin-top:20px;">
          <div class="panel-header"><h3 class="panel-title"><i class="fas fa-trophy" style="color:#fbbf24"></i> National Leaderboard (Top 10)</h3></div>
          <table class="data-table" style="font-size:0.85rem;">
            <thead><tr><th>Rank</th><th>Name</th><th>Zone / Branch</th><th>Achievement (FYP)</th><th>Momentum</th></tr></thead>
            <tbody>${leaderHTML}</tbody>
          </table>
        </div>`;

    App.setContent(pageHTML);

    // Countdown timer
    setInterval(() => {
      const end = new Date('2026-06-30T23:59:59').getTime();
      const now = new Date().getTime();
      const diff = end - now;
      if (diff < 0) return;
      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      document.getElementById('countdown').innerText = `${d}D ${h}H ${m}M`;
    }, 1000);

  </script>
</body>

</html>
