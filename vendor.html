<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsureCentive - Vendor Management</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <script src="js/mockData.js"></script>
    <script src="js/app.js"></script>
    <script>
        App.renderLayout('vendor');
        App.setPageTitle('External Vendor Lifecycle');

        const vendors = [
            { id: 'VND001', name: 'MacMillan Corporate Training', type: 'Training Partner', payout: 1500000, sla: 92, kyc: 'Valid', expiry: '2026-11-01', alert: false },
            { id: 'VND002', name: 'Taj Hotels & Resorts', type: 'Contest Sponsor', payout: 5000000, sla: 98, kyc: 'Valid', expiry: '2026-04-10', alert: true },
            { id: 'VND003', name: 'Tech Mahindra', type: 'Digital Partner', payout: 2500000, sla: 85, kyc: 'Expired', expiry: '2026-02-28', alert: true },
            { id: 'VND004', name: 'Makemytrip Corporate', type: 'Travel Partner', payout: 3200000, sla: 95, kyc: 'Valid', expiry: '2027-01-15', alert: false },
            { id: 'VND005', name: 'Gold Coin Jewels', type: 'Reward Fulfillment', payout: 800000, sla: 76, kyc: 'Pending', expiry: '2026-06-30', alert: false }
        ];

        const pageHTML = `
      <div class="grid-cards animate-slide-in">
        <div class="metric-card">
          <div class="metric-title">Total Vendor Obligation</div>
          <div class="metric-value">₹ 1.30 Cr</div>
          <div class="metric-trend trend-info"><i class="fas fa-handshake"></i> Active Contracts</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Critical Alerts / Expiries</div>
          <div class="metric-value" style="color:var(--danger)">2</div>
          <div class="metric-trend trend-down"><i class="fas fa-file-signature"></i> Requires immediate review</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Average Vendor SLA</div>
          <div class="metric-value">89%</div>
          <div class="metric-trend trend-up"><i class="fas fa-star" style="color:var(--warning)"></i> Based on IC feedback</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Onboarding Pipeline</div>
          <button class="btn btn-outline" style="margin-top:10px; width:100%"><i class="fas fa-user-plus"></i> Initiate New KYC Setup</button>
        </div>
      </div>

      <div class="panel animate-slide-in" style="animation-delay: 0.1s">
        <div class="panel-header">
          <h3 class="panel-title">Contract Register & Performance Scorecards</h3>
        </div>
        
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Vendor Code & Name</th>
                <th>Service Type</th>
                <th>Quarterly Payout Accrual</th>
                <th>SLA Score</th>
                <th>KYC Validation</th>
                <th>Contract Expiry</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${vendors.map(v => {
            let kycBadge = 'status-success';
            let btn = '<button class="action-btn"><i class="fas fa-file-invoice"></i></button>';
            if (v.kyc === 'Expired') { kycBadge = 'status-danger'; btn = '<button class="action-btn" title="Block Payout" style="color:var(--danger)"><i class="fas fa-ban"></i></button>'; }
            if (v.kyc === 'Pending') kycBadge = 'status-warning';

            const alertClass = v.alert ? 'style="background-color: var(--danger-bg)"' : '';

            return `
                <tr ${alertClass}>
                  <td><strong>${v.name}</strong> <br><small style="color:var(--text-muted)">${v.id}</small></td>
                  <td>${v.type}</td>
                  <td>${App.formatCurrency(v.payout)}</td>
                  <td>
                    <div style="display:flex; align-items:center; gap:8px;">
                      <div class="progress-bar-container" style="width: 60px; margin:0">
                        <div class="progress-bar" style="width: ${v.sla}%; background-color: ${v.sla > 90 ? 'var(--success)' : 'var(--warning)'}"></div>
                      </div>
                      ${v.sla}%
                    </div>
                  </td>
                  <td><span class="status-badge ${kycBadge}">${v.kyc}</span></td>
                  <td>
                    ${v.expiry}
                    ${v.alert ? '<br><span style="font-size:0.75rem; color:var(--danger); font-weight:bold"><i class="fas fa-stopwatch"></i> Action Req.</span>' : ''}
                  </td>
                  <td>${btn}</td>
                </tr>
              `}).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;

        App.setContent(pageHTML);
    </script>
</body>

</html>
